<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Mari Ventura</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap"
    />
    <!-- Styles are inlined on purpose: the app's CSS bundle is content-hashed and its
         filename changes every build, so this standalone page can't link to it. -->
    <style>
      :root {
        --ink-violet: #3b0373;
        --lilac: #a571d9;
        --background: #fcfbfe;
        --foreground: #1f0f26;
        --muted-foreground: #6b5a78;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 600;
        font-size: clamp(4.5rem, 20vw, 8rem);
        line-height: 1;
        letter-spacing: -0.02em;
        margin: 0;
        color: var(--ink-violet);
      }
      h2 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 600;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        margin: 1rem 0 0;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted-foreground);
        font-size: 0.95rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        background: var(--ink-violet);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: background-color 0.2s ease;
      }
      a:hover {
        background: var(--lilac);
      }
      a:focus-visible {
        outline: 2px solid var(--lilac);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Página não encontrada</h2>
      <p>A página que você procura não existe ou foi movida.</p>
      <a href="/">Voltar para o início</a>
    </main>
  </body>
</html>
